<!DOCTYPE html>
<html lang="en">
<head>
    <title>Meet Our Mentors</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #222;
        }

        .mentors-section {
            width: 100%;
            padding: 50px 30px;
            text-align: center;
        }

        .mentors-section h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .description {
            font-size: 17px;
            color: #555;
            margin-bottom: 40px;
        }

        .mentor-container {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 25px;

            max-width: 1550px;
            margin: auto;
        }

        .mentor-card {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 10px;

            padding: 15px;

            min-height: 320px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .mentor-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .mentor-card img {
            width: 200px;
            height: 190px;

            object-fit: cover;

            border-radius: 5px;

            margin-bottom: 15px;
        }

        /* Mentor Name */
        .mentor-card h2 {
            font-size: 20px;
            margin-bottom: 15px;
        }

        
        .company-logo {
            width: 70px !important;
            height: 40px !important;

            object-fit: contain !important;

            margin-top: auto;
        }

        @media (max-width: 1200px) {
            .mentor-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 700px) {
            .mentor-container {
                grid-template-columns: repeat(1, 1fr);
            }

            .mentor-card img {
                width: 220px;
                height: 200px;
            }
        }
    </style>
</head>

<body>

    <section class="mentors-section">

            Being Developers themselves, the Curriculum Team is an experienced

            </div>
