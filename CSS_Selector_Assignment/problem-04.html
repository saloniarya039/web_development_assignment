<!DOCTYPE html>
<html>
<head>
    <title>Periodic Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin: 25px;
            font-size: 32px;
        }

        .table {
            width: 1150px;
            margin: auto;
        }

        .row {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }

        .box {
            width: 52px;
            height: 52px;
            border: 2px solid black;
            box-sizing: border-box;
        }

        .green {
            background-color: #8ca52b;
        }

        .red {
            background-color: #ff6666;
        }

        .blue {
            background-color: blue;
        }

        .orange {
            background-color: #ff6600;
        }

        .purple {
            background-color: #b0008a;
        }

        .pink {
            background-color: #ff0060;
        }

        .yellow {
            background-color: #ffc800;
        }

        .grey {
            background-color: #6d5b60;
        }

        .empty {
            background-color: white;
            border: none;
        }

        .number {
            text-align: right;
            padding: 5px;
            font-size: 14px;
        }

        .silicon {
            width: 165px;
            height: 165px;
            background-color: #8ca52b;
            border: 2px solid black;
            padding: 10px;
            text-align: left;
            box-sizing: border-box;
            margin-left: 105px;
        }

        .silicon .si {
            font-size: 60px;
            margin-top: 35px;
        }

        .silicon .name {
            font-size: 16px;
        }

        .bottom {
            width: 580px;
            margin: 65px auto 0;
        }

        .lanth,
        .act {
            display: flex;
        }

        .small {
            width: 42px;
            height: 42px;
            border: 1px solid black;
            box-sizing: border-box;
            background-color: #4e632d;
        }

        .act .small {
            background-color: #9ac45c;
        }

        .label {
            text-align: left;
            padding: 7px;
        }
    </style>
</head>
